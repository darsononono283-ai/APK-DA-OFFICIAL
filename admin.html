<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin APKZone</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
body{
    margin:0;
    background:#080b16;
    color:white;
    font-family:Arial,sans-serif;
}

.navbar{
    background:#111525;
    border-bottom:1px solid #252a40;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.logo span{
    color:#8175ff;
}

.admin-box{
    max-width:700px;
    margin:40px auto;
    padding:25px;
    background:#111525;
    border:1px solid #252a40;
    border-radius:22px;
    box-shadow:0 20px 50px rgba(0,0,0,.3);
}

.login-box{
    max-width:450px;
    margin:80px auto;
    padding:30px;
    background:#111525;
    border:1px solid #252a40;
    border-radius:22px;
}

.admin-title{
    text-align:center;
    margin-bottom:30px;
}

.admin-title i,
.login-icon i{
    font-size:50px;
    color:#8175ff;
}

.login-icon{
    text-align:center;
    margin-bottom:25px;
}

.form-label{
    color:#c8ccda;
    font-weight:600;
}

.form-control,
.form-select{
    background:#080b16;
    border:1px solid #30354d;
    color:white;
    padding:12px;
    border-radius:12px;
}

.form-control:focus,
.form-select:focus{
    background:#080b16;
    color:white;
    border-color:#8175ff;
    box-shadow:0 0 0 3px rgba(129,117,255,.15);
}

.form-control::placeholder{
    color:#666d82;
}

.form-select option{
    background:#111525;
}

.btn-main{
    width:100%;
    border:0;
    padding:13px;
    border-radius:13px;
    background:linear-gradient(90deg,#635bff,#8b5cf6);
    color:white;
    font-weight:bold;
    font-size:16px;
}

.btn-main:disabled{
    opacity:.6;
}

.back-btn{
    color:#aaaec0;
    text-decoration:none;
}

.back-btn:hover{
    color:white;
}

#adminPanel{
    display:none;
}

#loginPanel{
    display:block;
}

.logout-btn{
    border:1px solid #383e58;
    background:transparent;
    color:#ff8b8b;
    padding:7px 13px;
    border-radius:10px;
}

.app-list{
    max-width:700px;
    margin:25px auto 60px;
}

.app-item{
    background:#111525;
    border:1px solid #252a40;
    border-radius:16px;
    padding:15px;
    margin-bottom:12px;
}

.app-icon{
    width:60px;
    height:60px;
    object-fit:cover;
    border-radius:14px;
    background:#080b16;
}

.app-name{
    font-weight:bold;
    font-size:17px;
}

.app-info{
    color:#9298aa;
    font-size:13px;
}

.btn-edit{
    background:#2d6cdf;
    color:white;
    border:0;
    border-radius:9px;
    padding:7px 11px;
}

.btn-delete{
    background:#dc3545;
    color:white;
    border:0;
    border-radius:9px;
    padding:7px 11px;
}

.btn-cancel{
    background:#343a40;
    color:white;
    border:0;
    border-radius:9px;
    padding:10px;
    display:none;
    width:100%;
    margin-top:10px;
}

.empty{
    text-align:center;
    color:#777e91;
    padding:25px;
}
</style>
</head>

<body>

<nav class="navbar">
<div class="container py-3 d-flex justify-content-between align-items-center">

<div class="logo">
<i class="bi bi-box-seam-fill"></i>
APK<span>Zone</span>
<small class="text-secondary"> Admin</small>
</div>

<div id="navRight">
<a href="index.html" class="back-btn">
<i class="bi bi-house"></i> Beranda
</a>
</div>

</div>
</nav>


<!-- LOGIN -->

<div id="loginPanel" class="container">

<div class="login-box">

<div class="login-icon">
<i class="bi bi-shield-lock-fill"></i>

<h2 class="mt-3">Admin Login</h2>

<p class="text-secondary">
Masuk untuk mengelola APKZone
</p>
</div>

<form id="loginForm">

<div class="mb-3">

<label class="form-label">Email</label>

<input
type="email"
id="loginEmail"
class="form-control"
placeholder="Email admin"
required>

</div>

<div class="mb-4">

<label class="form-label">Password</label>

<input
type="password"
id="loginPassword"
class="form-control"
placeholder="Password"
required>

</div>

<button
type="submit"
id="loginBtn"
class="btn-main">

<i class="bi bi-box-arrow-in-right"></i>
Login

</button>

</form>

<div id="loginStatus"></div>

</div>
</div>


<!-- ADMIN -->

<div id="adminPanel">

<div class="container">

<div class="admin-box">

<div class="admin-title">

<i class="bi bi-cloud-arrow-up-fill"></i>

<h2 class="mt-3" id="formTitle">
Tambah APK
</h2>

<p class="text-secondary">
Masukkan informasi aplikasi
</p>

</div>


<form id="addAppForm">

<div class="mb-3">

<label class="form-label">
Nama Aplikasi
</label>

<input
type="text"
id="name"
class="form-control"
placeholder="Contoh: TikTok"
required>

</div>


<div class="mb-3">

<label class="form-label">
Deskripsi
</label>

<textarea
id="description"
class="form-control"
rows="3"
placeholder="Deskripsi aplikasi..."></textarea>

</div>


<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">
Versi
</label>

<input
type="text"
id="version"
class="form-control"
placeholder="Contoh: 2.5.1">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Ukuran APK
</label>

<input
type="text"
id="size"
class="form-control"
placeholder="Contoh: 120 MB">

</div>

</div>


<div class="mb-3">

<label class="form-label">
Kategori
</label>

<select id="category" class="form-select">

<option value="Game">Game</option>
<option value="Sosial">Sosial</option>
<option value="Tools">Tools</option>
<option value="Media">Media</option>
<option value="Lainnya">Lainnya</option>

</select>

</div>


<div class="mb-3">

<label class="form-label">
URL Icon APK
</label>

<input
type="url"
id="icon"
class="form-control"
placeholder="https://contoh.com/icon.png">

</div>


<div class="mb-4">

<label class="form-label">
URL Download APK
</label>

<input
type="url"
id="download_url"
class="form-control"
placeholder="https://contoh.com/aplikasi.apk"
required>

</div>


<button
type="submit"
id="saveBtn"
class="btn-main">

<i class="bi bi-plus-circle"></i>
Tambahkan APK

</button>

<button
type="button"
id="cancelBtn"
class="btn-cancel">

<i class="bi bi-x-circle"></i>
Batal Edit

</button>

</form>

<div id="status"></div>

</div>


<!-- DAFTAR APK -->

<div class="app-list">

<h4 class="mb-3">
<i class="bi bi-grid-fill"></i>
Daftar APK
</h4>

<div id="appList">
<div class="empty">
Memuat APK...
</div>
</div>

</div>

</div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>


<script>

let editingId = null;


/* ELEMENT */

const loginForm =
document.getElementById("loginForm");

const loginPanel =
document.getElementById("loginPanel");

const adminPanel =
document.getElementById("adminPanel");

const loginBtn =
document.getElementById("loginBtn");

const loginStatus =
document.getElementById("loginStatus");

const form =
document.getElementById("addAppForm");

const saveBtn =
document.getElementById("saveBtn");

const cancelBtn =
document.getElementById("cancelBtn");

const status =
document.getElementById("status");

const appList =
document.getElementById("appList");

const formTitle =
document.getElementById("formTitle");

const navRight =
document.getElementById("navRight");


/* LOGIN */

loginForm.addEventListener("submit", async function(e){

e.preventDefault();

const email =
document.getElementById("loginEmail").value.trim();

const password =
document.getElementById("loginPassword").value;

loginBtn.disabled = true;

loginBtn.innerHTML = `
<span class="spinner-border spinner-border-sm"></span>
Login...
`;

loginStatus.innerHTML = "";

const {data,error} =
await supabaseClient.auth.signInWithPassword({
email,
password
});

if(error){

loginStatus.innerHTML = `
<div class="alert alert-danger">
Login gagal.<br>
<small>${error.message}</small>
</div>
`;

loginBtn.disabled = false;

loginBtn.innerHTML = `
<i class="bi bi-box-arrow-in-right"></i>
Login
`;

return;
}

showAdmin();

});


/* SHOW ADMIN */

function showAdmin(){

loginPanel.style.display = "none";

adminPanel.style.display = "block";

navRight.innerHTML = `
<div class="d-flex align-items-center gap-2">

<a href="index.html" class="back-btn">
<i class="bi bi-house"></i>
Beranda
</a>

<button
onclick="logout()"
class="logout-btn">

<i class="bi bi-box-arrow-right"></i>
Keluar

</button>

</div>
`;

loadApps();

}


/* CHECK SESSION */

async function checkSession(){

const {
data:{session}
} =
await supabaseClient.auth.getSession();

if(session){

showAdmin();

}

}

checkSession();


/* LOGOUT */

async function logout(){

await supabaseClient.auth.signOut();

location.reload();

}


/* TAMBAH / EDIT */

form.addEventListener("submit", async function(e){

e.preventDefault();


const {
data:{session}
} =
await supabaseClient.auth.getSession();


if(!session){

status.innerHTML = `
<div class="alert alert-danger">
Session login tidak ditemukan.
Silakan login kembali.
</div>
`;

return;

}


const appData = {

name:
document.getElementById("name").value.trim(),

description:
document.getElementById("description").value.trim(),

version:
document.getElementById("version").value.trim(),

size:
document.getElementById("size").value.trim(),

category:
document.getElementById("category").value,

icon:
document.getElementById("icon").value.trim(),

download_url:
document.getElementById("download_url").value.trim()

};


saveBtn.disabled = true;

saveBtn.innerHTML = `
<span class="spinner-border spinner-border-sm"></span>
Menyimpan...
`;


let result;


if(editingId){

result =
await supabaseClient
.from("apps")
.update(appData)
.eq("id",editingId);

}else{

result =
await supabaseClient
.from("apps")
.insert([appData]);

}


if(result.error){

console.error(result.error);

status.innerHTML = `
<div class="alert alert-danger">
Gagal menyimpan APK.<br>
<small>${result.error.message}</small>
</div>
`;

saveBtn.disabled = false;

updateButton();

return;

}


status.innerHTML = `
<div class="alert alert-success">
<i class="bi bi-check-circle-fill"></i>
${editingId ? "APK berhasil diperbarui!" : "APK berhasil ditambahkan!"}
</div>
`;

resetForm();

loadApps();

});


/* LOAD APPS */

async function loadApps(){

const {
data,
error
} =
await supabaseClient
.from("apps")
.select("*")
.order("created_at",{ascending:false});


if(error){

appList.innerHTML = `
<div class="alert alert-danger">
Gagal memuat APK.<br>
<small>${error.message}</small>
</div>
`;

return;

}


if(!data || data.length === 0){

appList.innerHTML = `
<div class="empty">
Belum ada APK.
</div>
`;

return;

}


appList.innerHTML =
data.map(app => `

<div class="app-item">

<div class="d-flex align-items-center gap-3">

<img
src="${app.icon || 'https://via.placeholder.com/60'}"
class="app-icon"
onerror="this.src='https://via.placeholder.com/60'"
>

<div class="flex-grow-1">

<div class="app-name">
${escapeHTML(app.name)}
</div>

<div class="app-info">
${escapeHTML(app.category || 'Lainnya')}
${app.version ? ' • Versi ' + escapeHTML(app.version) : ''}
${app.size ? ' • ' + escapeHTML(app.size) : ''}
</div>

</div>

</div>


<div class="d-flex gap-2 mt-3">

<button
class="btn-edit"
onclick="editApp(${app.id})">

<i class="bi bi-pencil"></i>
Edit

</button>

<button
class="btn-delete"
onclick="deleteApp(${app.id})">

<i class="bi bi-trash"></i>
Hapus

</button>

</div>

</div>

`).join("");

}


/* EDIT */

async function editApp(id){

const {
data,
error
} =
await supabaseClient
.from("apps")
.select("*")
.eq("id",id)
.single();


if(error){

alert(error.message);
return;

}


editingId = id;

document.getElementById("name").value =
data.name || "";

document.getElementById("description").value =
data.description || "";

document.getElementById("version").value =
data.version || "";

document.getElementById("size").value =
data.size || "";

document.getElementById("category").value =
data.category || "Lainnya";

document.getElementById("icon").value =
data.icon || "";

document.getElementById("download_url").value =
data.download_url || "";


formTitle.innerText = "Edit APK";

updateButton();

cancelBtn.style.display = "block";

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* DELETE */

async function deleteApp(id){

const yakin =
confirm("Yakin ingin menghapus APK ini?");

if(!yakin) return;


const {
error
} =
await supabaseClient
.from("apps")
.delete()
.eq("id",id);


if(error){

alert(
"Gagal menghapus APK:\n" +
error.message
);

return;

}


alert("APK berhasil dihapus.");

loadApps();

}


/* RESET */

function resetForm(){

editingId = null;

form.reset();

formTitle.innerText = "Tambah APK";

cancelBtn.style.display = "none";

updateButton();

}


cancelBtn.addEventListener("click",function(){

resetForm();

status.innerHTML = "";

});


/* BUTTON */

function updateButton(){

if(editingId){

saveBtn.innerHTML = `
<i class="bi bi-save"></i>
Simpan Perubahan
`;

}else{

saveBtn.innerHTML = `
<i class="bi bi-plus-circle"></i>
Tambahkan APK
`;

}

saveBtn.disabled = false;

}


/* ESCAPE HTML */

function escapeHTML(text){

return String(text || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
