<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin DA•OFFICIAL</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #080b16;
    color: white;
    font-family: Arial, sans-serif;
}

.navbar {
    background: #111525;
    border-bottom: 1px solid #252a40;
}

.logo {
    font-size: 21px;
    font-weight: bold;
}

.logo span {
    color: #8175ff;
}

.admin-box {
    max-width: 700px;
    margin: 45px auto;
    padding: 25px;
    background: #111525;
    border: 1px solid #252a40;
    border-radius: 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,.3);
}

.admin-title {
    text-align: center;
    margin-bottom: 30px;
}

.admin-title i {
    font-size: 45px;
    color: #8175ff;
}

.form-label {
    color: #c8ccda;
    font-weight: 600;
}

.form-control,
.form-select {
    background: #080b16;
    border: 1px solid #30354d;
    color: white;
    padding: 12px;
    border-radius: 12px;
}

.form-control:focus,
.form-select:focus {
    background: #080b16;
    color: white;
    border-color: #8175ff;
    box-shadow: 0 0 0 3px rgba(129,117,255,.15);
}

.form-control::placeholder {
    color: #666d82;
}

.form-select option {
    background: #111525;
}

.btn-save,
.btn-login {
    width: 100%;
    border: none;
    padding: 13px;
    border-radius: 13px;
    background: linear-gradient(90deg,#635bff,#8b5cf6);
    color: white;
    font-weight: bold;
    font-size: 16px;
}

.btn-save:hover,
.btn-login:hover {
    opacity: .9;
}

.btn-save:disabled,
.btn-login:disabled {
    opacity: .6;
}

#status,
#loginStatus {
    margin-top: 18px;
}

.back-btn {
    color: #aaaec0;
    text-decoration: none;
}

.back-btn:hover {
    color: white;
}

#adminPanel {
    display: none;
}

.logout-btn {
    border: 1px solid #383e58;
    background: transparent;
    color: #ff8b8b;
    padding: 7px 13px;
    border-radius: 10px;
}

.logout-btn:hover {
    background: rgba(255,80,80,.1);
}

.login-box {
    max-width: 450px;
    margin: 80px auto;
    padding: 30px;
    background: #111525;
    border: 1px solid #252a40;
    border-radius: 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,.3);
}

.login-icon {
    text-align: center;
    margin-bottom: 25px;
}

.login-icon i {
    font-size: 55px;
    color: #8175ff;
}
</style>
</head>

<body>

<nav class="navbar">
    <div class="container py-3 d-flex justify-content-between align-items-center">

        <div class="logo">
            <i class="bi bi-box-seam-fill"></i>
            APK<span>Zone</span>
            <small class="text-secondary"> Admin</small>
        </div>

        <div id="navRight">
            <a href="index.html" class="back-btn">
                <i class="bi bi-house"></i>
                Beranda
            </a>
        </div>

    </div>
</nav>


<!-- ================= LOGIN ================= -->

<div id="loginPanel" class="container">

    <div class="login-box">

        <div class="login-icon">
            <i class="bi bi-shield-lock-fill"></i>

            <h2 class="mt-3">
                Admin Login
            </h2>

            <p class="text-secondary">
                Masuk untuk mengelola APKZone
            </p>
        </div>

        <form id="loginForm">

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    class="form-control"
                    placeholder="Email admin"
                    required
                >

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    class="form-control"
                    placeholder="Password"
                    required
                >

            </div>

            <button
                type="submit"
                id="loginBtn"
                class="btn-login"
            >
                <i class="bi bi-box-arrow-in-right"></i>
                Login
            </button>

        </form>

        <div id="loginStatus"></div>

    </div>

</div>


<!-- ================= ADMIN PANEL ================= -->

<div id="adminPanel">

<div class="container">

    <div class="admin-box">

        <div class="admin-title">

            <i class="bi bi-cloud-arrow-up-fill"></i>

            <h2 class="mt-3">
                Tambah APK
            </h2>

            <p class="text-secondary">
                Masukkan informasi aplikasi
            </p>

        </div>


        <form id="addAppForm">

            <div class="mb-3">

                <label class="form-label">
                    Nama Aplikasi
                </label>

                <input
                    type="text"
                    id="name"
                    class="form-control"
                    placeholder="Contoh: TikTok"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Deskripsi
                </label>

                <textarea
                    id="description"
                    class="form-control"
                    rows="3"
                    placeholder="Deskripsi aplikasi..."
                ></textarea>

            </div>


            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Versi
                    </label>

                    <input
                        type="text"
                        id="version"
                        class="form-control"
                        placeholder="Contoh: 2.5.1"
                    >

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Ukuran APK
                    </label>

                    <input
                        type="text"
                        id="size"
                        class="form-control"
                        placeholder="Contoh: 120 MB"
                    >

                </div>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Kategori
                </label>

                <select id="category" class="form-select">

                    <option value="Game">Game</option>
                    <option value="Sosial">Sosial</option>
                    <option value="Tools">Tools</option>
                    <option value="Media">Media</option>
                    <option value="Lainnya">Lainnya</option>

                </select>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    URL Icon APK
                </label>

                <input
                    type="url"
                    id="icon"
                    class="form-control"
                    placeholder="https://contoh.com/icon.png"
                >

                <small class="text-secondary">
                    Masukkan link gambar icon.
                </small>

            </div>


            <div class="mb-4">

                <label class="form-label">
                    URL Download APK
                </label>

                <input
                    type="url"
                    id="download_url"
                    class="form-control"
                    placeholder="https://contoh.com/aplikasi.apk"
                    required
                >

                <small class="text-secondary">
                    Bisa menggunakan MediaFire, Google Drive,
                    atau hosting APK lainnya.
                </small>

            </div>


            <button
                type="submit"
                id="saveBtn"
                class="btn-save"
            >

                <i class="bi bi-plus-circle"></i>
                Tambahkan APK

            </button>

        </form>

        <div id="status"></div>

    </div>

</div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>


<script>

/* ================= LOGIN ================= */

const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const loginStatus = document.getElementById("loginStatus");

const loginPanel = document.getElementById("loginPanel");
const adminPanel = document.getElementById("adminPanel");
const navRight = document.getElementById("navRight");


loginForm.addEventListener("submit", async function(e) {

    e.preventDefault();

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    loginBtn.disabled = true;

    loginBtn.innerHTML = `
        <span class="spinner-border spinner-border-sm"></span>
        Login...
    `;

    loginStatus.innerHTML = "";

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (error) {

        console.error(error);

        loginStatus.innerHTML = `
            <div class="alert alert-danger">
                <i class="bi bi-exclamation-circle"></i>
                Login gagal.
                <br>
                <small>${error.message}</small>
            </div>
        `;

        loginBtn.disabled = false;

        loginBtn.innerHTML = `
            <i class="bi bi-box-arrow-in-right"></i>
            Login
        `;

        return;
    }

    showAdmin(data.session);

});


/* ================= SHOW ADMIN ================= */

function showAdmin(session) {

    loginPanel.style.display = "none";
    adminPanel.style.display = "block";

    navRight.innerHTML = `
        <div class="d-flex align-items-center gap-2">

            <a href="index.html" class="back-btn">
                <i class="bi bi-house"></i>
                Beranda
            </a>

            <button
                onclick="logout()"
                class="logout-btn"
            >
                <i class="bi bi-box-arrow-right"></i>
                Keluar
            </button>

        </div>
    `;

}


/* ================= LOGOUT ================= */

async function logout() {

    await supabaseClient.auth.signOut();

    location.reload();

}


/* ================= CEK SESSION ================= */

async function checkSession() {

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (session) {

        showAdmin(session);

    }

}

checkSession();


/* ================= TAMBAH APK ================= */

const form =
    document.getElementById("addAppForm");

const saveBtn =
    document.getElementById("saveBtn");

const status =
    document.getElementById("status");


form.addEventListener("submit", async function(e) {

    e.preventDefault();

    /* CEK SESSION */

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {

        status.innerHTML = `
            <div class="alert alert-danger">
                Silakan login terlebih dahulu.
            </div>
        `;

        return;
    }


    const name =
        document.getElementById("name").value.trim();

    const description =
        document.getElementById("description").value.trim();

    const version =
        document.getElementById("version").value.trim();

    const size =
        document.getElementById("size").value.trim();

    const category =
        document.getElementById("category").value;

    const icon =
        document.getElementById("icon").value.trim();

    const download_url =
        document.getElementById("download_url").value.trim();


    saveBtn.disabled = true;

    saveBtn.innerHTML = `
        <span class="spinner-border spinner-border-sm"></span>
        Menyimpan...
    `;

    status.innerHTML = "";


    const { data, error } =
        await supabaseClient
        .from("apps")
        .insert([
            {
                name: name,
                description: description,
                version: version,
                size: size,
                category: category,
                icon: icon,
                download_url: download_url
            }
        ])
        .select();


    if (error) {

        console.error(error);

        status.innerHTML = `
            <div class="alert alert-danger">
                <i class="bi bi-exclamation-circle"></i>
                Gagal menambahkan APK.
                <br>
                <small>${error.message}</small>
            </div>
        `;

        saveBtn.disabled = false;

        saveBtn.innerHTML = `
            <i class="bi bi-plus-circle"></i>
            Tambahkan APK
        `;

        return;
    }


    status.innerHTML = `
        <div class="alert alert-success">
            <i class="bi bi-check-circle-fill"></i>
            APK berhasil ditambahkan!
        </div>
    `;


    form.reset();

    saveBtn.disabled = false;

    saveBtn.innerHTML = `
        <i class="bi bi-plus-circle"></i>
        Tambahkan APK
    `;

});

</script>

</body>
</html>
