<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | APK DA•OFFICIAL</title><style>body{margin:0;background:#090b13;color:#f5f6fc;font:14px Arial}.wrap{max-width:950px;margin:25px auto;padding:12px}.panel{background:#151a29;border:1px solid #ffffff20;border-radius:17px;padding:20px;margin:15px 0}h1,h2{font-size:20px}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 13px;background:#0b1020;color:white;border:1px solid #ffffff25;border-radius:9px}button{padding:11px 15px;border:0;border-radius:9px;background:#8059d8;color:white;font-weight:bold;margin:4px;cursor:pointer}.danger{background:#9a4050}.secondary{background:#343c50}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #ffffff20}small,.msg{color:#b5bdd0}@media(max-width:600px){.grid{grid-template-columns:1fr}.panel{padding:14px}.table{overflow:auto}}</style></head><body><main class="wrap"><p><a href="index.html" style="color:#c4b5ff">← Lihat website</a></p><section class="panel" id="login"><h1>Login administrator</h1><small>Buat akun admin melalui Supabase Authentication terlebih dahulu.</small><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signIn">Masuk</button><p class="msg" id="loginMsg"></p></section><div id="dash" class="hidden"><section class="panel"><h2>Tambah / Edit aplikasi</h2><form id="form"><input id="id" type="hidden"><div class="grid"><label>Nama<input id="name" required></label><label>Slug<input id="slug" required pattern="[a-z0-9-]+"></label><label>Kategori<select id="category"><option>Game</option><option>Sosial</option><option>Media</option><option>Tools</option><option>Lainnya</option></select></label><label>Pengembang<input id="developer"></label><label>Versi<input id="version"></label><label>Ukuran<input id="size"></label><label>Foto / ikon aplikasi<input id="iconFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><label>Link unduh APK<input id="downloadUrl" type="url" placeholder="https://contoh.com/aplikasi.apk" required></label></div><label>Deskripsi<textarea id="description"></textarea></label><label><input id="published" type="checkbox" checked style="width:auto"> Terbitkan di website</label><button type="submit">Simpan</button><button type="button" class="secondary" id="reset">Kosongkan</button><p id="formMsg" class="msg"></p></form></section><section class="panel"><h2>Daftar aplikasi</h2><div style="overflow:auto"><table><thead><tr><th>Nama</th><th>Kategori</th><th>Versi</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div><button class="secondary" id="logout">Keluar</button></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script>
const db=window.db,ICON_BUCKET="app-icons";let apps=[];const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"\']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","\'":"&#39;"}[c]));const msg=(id,s)=>$(id).textContent=s;
async function load(){let {data,error}=await db.from("apps").select("*").order("created_at",{ascending:false});if(error)throw error;apps=data||[];$("rows").innerHTML=apps.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.category)}</td><td>${esc(a.version||"-")}</td><td><button data-edit="${a.id}">Edit</button><button class="danger" data-del="${a.id}">Hapus</button></td></tr>`).join("")}
async function enter(){let {data:{user}}=await db.auth.getUser();let {data:admin,error}=await db.from("admin_users").select("user_id").eq("user_id",user.id).maybeSingle();if(error)throw error;if(!admin)throw Error("Akun belum didaftarkan sebagai admin di tabel admin_users.");$("login").classList.add("hidden");$("dash").classList.remove("hidden");await load()}
$("signIn").onclick=async()=>{try{let {error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error)throw error;await enter()}catch(e){msg("loginMsg",e.message)}};
$("name").addEventListener("input",()=>{if(!$("id").value&&!$("slug").dataset.touched)$("slug").value=$("name").value.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")});$("slug").addEventListener("input",()=>{$("slug").dataset.touched="1"});$("form").onsubmit=async e=>{e.preventDefault();try{let user=(await db.auth.getUser()).data.user;let id=$("id").value,p={name:$("name").value.trim(),slug:$("slug").value.trim(),category:$("category").value,developer:$("developer").value,version:$("version").value,size:$("size").value,download_url:$("downloadUrl").value.trim(),description:$("description").value,is_published:$("published").checked,updated_at:new Date().toISOString()};let img=$("iconFile").files[0];if(img){if(!["image/png","image/jpeg","image/webp","image/gif"].includes(img.type)||img.size>5*1024*1024)throw Error("Pilih foto PNG, JPG, WEBP, atau GIF maksimal 5 MB.");let ext=(img.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");let path=user.id+"/"+crypto.randomUUID()+"."+ext;let {error:uploadError}=await db.storage.from(ICON_BUCKET).upload(path,img,{upsert:false,contentType:img.type});if(uploadError)throw uploadError;p.icon_url=db.storage.from(ICON_BUCKET).getPublicUrl(path).data.publicUrl}let r=id?await db.from("apps").update(p).eq("id",id):await db.from("apps").insert(p);if(r.error)throw r.error;msg("formMsg","Berhasil disimpan.");$("form").reset();$("id").value="";$("slug").dataset.touched="";await load()}catch(e){msg("formMsg",e.message)}};
$("rows").onclick=async e=>{let a=apps.find(x=>x.id===e.target.dataset.edit);if(a){$("id").value=a.id;$("name").value=a.name;$("slug").value=a.slug;$("category").value=a.category;$("developer").value=a.developer||"";$("version").value=a.version||"";$("size").value=a.size||"";$("downloadUrl").value=a.download_url||"";$("iconFile").value="";$("description").value=a.description||"";$("published").checked=a.is_published;window.scrollTo(0,0)}let del=e.target.dataset.del;if(del&&confirm("Hapus aplikasi?")){let {error}=await db.from("apps").delete().eq("id",del);if(error)alert(error.message);else await load()}};
$("reset").onclick=()=>{$("form").reset();$("id").value="";msg("formMsg","")};$("logout").onclick=async()=>{await db.auth.signOut();location.reload()};
(async()=>{try{if(db){let {data:{session}}=await db.auth.getSession();if(session)await enter()}}catch(e){msg("loginMsg",e.message)}})();
</script></body></html>
