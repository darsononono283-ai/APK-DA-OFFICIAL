<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detail APK | APK DA•OFFICIAL</title><style>body{margin:0;background:#090b13;color:#f5f6fc;font:14px Arial}.wrap{max-width:760px;margin:30px auto;padding:15px}.panel{background:#151a29;border:1px solid #ffffff20;border-radius:20px;padding:24px}.back{color:#c4b5ff;text-decoration:none}.head{display:flex;gap:17px;align-items:center;margin:25px 0}.head img{width:80px;height:80px;object-fit:cover;border-radius:18px;background:#392b62}.muted{color:#9ba3b6;font-size:12px}.stats{display:flex;gap:30px;border-block:1px solid #ffffff20;padding:18px 0}.desc{white-space:pre-wrap;line-height:1.8;color:#cbd0df}.download{display:block;text-align:center;padding:14px;background:#8059d8;border-radius:12px;color:white;text-decoration:none;margin-top:20px;font-weight:bold}</style></head><body><main class="wrap"><a class="back" href="index.html">← Beranda</a><section class="panel" id="detail">Memuat...</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script>
const db=window.db;const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
(async()=>{let el=document.getElementById("detail");try{let id=new URLSearchParams(location.search).get("id");if(!id)throw Error("ID aplikasi tidak ditemukan.");let {data:a,error}=await db.from("apps").select("*").eq("id",id).eq("is_published",true).single();if(error)throw error;let url=a.download_url||"";el.innerHTML=`<div class="head"><img src="${esc(a.icon_url)}"><div><h1>${esc(a.name)}</h1><div class="muted">${esc(a.developer)} · ${esc(a.category)}</div></div></div><div class="stats"><span>${esc(a.version||"-")}<br><small>Versi</small></span><span>${esc(a.size||"-")}<br><small>Ukuran</small></span><span>Android<br><small>Platform</small></span></div><h3>Tentang aplikasi</h3><p class="desc">${esc(a.description)}</p>${url?`<a class="download" href="${esc(url)}" target="_blank" rel="noopener">Unduh APK</a>`:'<p class="muted">File APK belum tersedia.</p>'}<p class="muted">Pastikan sumber dan izin aplikasi tepercaya sebelum memasang.</p>`;document.title=a.name}catch(e){el.textContent="Gagal memuat: "+e.message}})();
</script></body></html>
