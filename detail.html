
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>Detail Aplikasi | APK DA•OFFICIAL</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .detail-wrap {
      max-width: 850px;
      margin: 35px auto;
      padding: 0 18px;
    }

    .back-link {
      display: inline-block;
      color: #c4b5fd;
      text-decoration: none;
      margin-bottom: 20px;
    }

    .detail-panel {
      padding: 25px;
      border: 1px solid #ffffff20;
      border-radius: 22px;
      background: linear-gradient(145deg, #ffffff12, #ffffff05);
      backdrop-filter: blur(18px);
    }

    .detail-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .detail-icon {
      width: 85px;
      height: 85px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: #49366f;
      font-size: 38px;
      flex-shrink: 0;
    }

    .detail-header h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .detail-muted {
      color: #aeb5c7;
      font-size: 13px;
    }

    .detail-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 25px 0;
    }

    .stat {
      padding: 15px 10px;
      border-radius: 13px;
      background: #ffffff0c;
      border: 1px solid #ffffff15;
      text-align: center;
    }

    .stat strong {
      display: block;
      margin-bottom: 6px;
    }

    .stat small {
      color: #aeb5c7;
    }

    .detail-description {
      color: #c4c9d8;
      line-height: 1.8;
      white-space: pre-line;
      margin-top: 12px;
    }

    .download-btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      text-align: center;
      text-decoration: none;
      color: white;
      background: linear-gradient(120deg, #8059d8, #5369c9);
      border-radius: 13px;
      font-weight: bold;
    }

    .download-disabled {
      opacity: .5;
      pointer-events: none;
    }

    .warning {
      margin-top: 15px;
      color: #aeb5c7;
      font-size: 12px;
      line-height: 1.7;
    }

    @media(max-width: 500px) {
      .detail-panel {
        padding: 18px;
      }

      .detail-header h1 {
        font-size: 21px;
      }

      .detail-icon {
        width: 70px;
        height: 70px;
      }
    }
  </style>
</head>

<body>

  <header class="navbar">
    <div class="logo">APK DA<span>•</span>OFFICIAL</div>
  </header>

  <main class="detail-wrap">

    <a href="index.html" class="back-link">
      ← Kembali ke beranda
    </a>

    <section class="detail-panel" id="detailContent">
      Memuat informasi aplikasi...
    </section>

  </main>

  <footer>
    <p>© 2026 APK DA•OFFICIAL V3</p>
    <small>Platform berbagi aplikasi Android.</small>
  </footer>

  <script>
    const appData = {
      tiktok: {
        name: "TikTok",
        category: "Sosial",
        developer: "TikTok Pte. Ltd.",
        version: "Belum ditentukan",
        size: "Belum ditentukan",
        icon: "♪",
        description: "Platform video pendek untuk membuat, menonton, dan berbagi video.",
        downloadUrl: ""
      },

      spotify: {
        name: "Spotify",
        category: "Media",
        developer: "Spotify AB",
        version: "Belum ditentukan",
        size: "Belum ditentukan",
        icon: "♫",
        description: "Aplikasi untuk mendengarkan musik dan podcast.",
        downloadUrl: ""
      },

      capcut: {
        name: "CapCut",
        category: "Tools",
        developer: "Bytedance",
        version: "Belum ditentukan",
        size: "Belum ditentukan",
        icon: "✂",
        description: "Aplikasi untuk mengedit video dan membuat konten.",
        downloadUrl: ""
      },

      minecraft: {
        name: "Minecraft",
        category: "Game",
        developer: "Mojang",
        version: "Belum ditentukan",
        size: "Belum ditentukan",
        icon: "▦",
        description: "Game petualangan dan kreativitas dalam dunia blok.",
        downloadUrl: ""
      },

      whatsapp: {
        name: "WhatsApp",
        category: "Sosial",
        developer: "WhatsApp LLC",
        version: "Belum ditentukan",
        size: "Belum ditentukan",
        icon: "◉",
        description: "Aplikasi pesan dan panggilan.",
        downloadUrl: ""
      },

      filemanager: {
        name: "File Manager",
        category: "Tools",
        developer: "Pengembang belum ditentukan",
        version: "Belum ditentukan",
        size: "Belum ditentukan",
        icon: "▤",
        description: "Aplikasi untuk mengelola file perangkat.",
        downloadUrl: ""
      }
    };

    const params = new URLSearchParams(location.search);
    const appId = params.get("app");
    const app = appData[appId];
    const content = document.getElementById("detailContent");

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    if (!app) {
      content.innerHTML = `
        <h2>Aplikasi tidak ditemukan</h2>
        <p class="detail-muted">
          Aplikasi yang kamu cari belum tersedia.
        </p>
        <a href="index.html" class="download-btn">
          Kembali ke beranda
        </a>
      `;
    } else {
      const download = app.downloadUrl
        ? `<a class="download-btn"
             href="${escapeHTML(app.downloadUrl)}"
             target="_blank"
             rel="noopener noreferrer">
             Unduh APK
           </a>`
        : `<div class="download-btn download-disabled">
             Link unduhan belum tersedia
           </div>`;

      content.innerHTML = `
        <div class="detail-header">
          <div class="detail-icon">${escapeHTML(app.icon)}</div>
          <div>
            <h1>${escapeHTML(app.name)}</h1>
            <p class="detail-muted">
              ${escapeHTML(app.developer)}
            </p>
          </div>
        </div>

        <div class="detail-stats">
          <div class="stat">
            <strong>${escapeHTML(app.version)}</strong>
            <small>Versi</small>
          </div>

          <div class="stat">
            <strong>${escapeHTML(app.size)}</strong>
            <small>Ukuran</small>
          </div>

          <div class="stat">
            <strong>${escapeHTML(app.category)}</strong>
            <small>Kategori</small>
          </div>
        </div>

        <h3>Tentang aplikasi</h3>
        <p class="detail-description">
          ${escapeHTML(app.description)}
        </p>

        ${download}

        <p class="warning">
          Pastikan aplikasi berasal dari sumber tepercaya
          dan memiliki izin distribusi sebelum memasangnya.
        </p>
      `;

      document.title = app.name + " | APK DA•OFFICIAL";
    }
  </script>

</body>
</html>
