<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Detail APK - DA•OFFICIAL</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080b16;
    color:white;
    font-family:Arial,sans-serif;
}

.navbar-custom{
    background:#111525;
    border-bottom:1px solid #252a40;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.logo span{
    color:#8175ff;
}

.back-btn{
    color:#aaa;
    text-decoration:none;
}

.back-btn:hover{
    color:white;
}

.detail-container{
    max-width:800px;
    margin:40px auto;
    padding:20px;
}

.detail-card{
    background:#111525;
    border:1px solid #252a40;
    border-radius:25px;
    padding:30px;
}

.app-header{
    display:flex;
    align-items:center;
    gap:20px;
}

.app-icon{
    width:100px;
    height:100px;
    border-radius:24px;
    object-fit:cover;
    border:1px solid #30354d;
}

.app-name{
    font-size:30px;
    font-weight:bold;
}

.category{
    display:inline-block;
    margin-top:8px;
    padding:6px 12px;
    border-radius:20px;
    background:#25204a;
    color:#9f96ff;
    font-size:13px;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:30px;
}

.info-box{
    background:#080b16;
    border:1px solid #252a40;
    border-radius:15px;
    padding:15px;
    text-align:center;
}

.info-box i{
    color:#8175ff;
    font-size:20px;
}

.info-label{
    color:#737b91;
    font-size:12px;
    margin-top:6px;
}

.info-value{
    font-size:14px;
    margin-top:3px;
}

.description{
    margin-top:30px;
}

.description h5{
    font-weight:bold;
}

.description p{
    color:#969caf;
    line-height:1.7;
}

.download-btn{
    width:100%;
    border:none;
    padding:15px;
    border-radius:14px;
    background:linear-gradient(90deg,#635bff,#8b5cf6);
    color:white;
    font-weight:bold;
    font-size:16px;
    text-decoration:none;
    display:block;
    text-align:center;
    margin-top:30px;
}

.download-btn:hover{
    color:white;
    opacity:.9;
}

.loading{
    text-align:center;
    padding:80px 20px;
    color:#777f96;
}

.error{
    text-align:center;
    padding:80px 20px;
}

.error i{
    font-size:55px;
    color:#635bff;
}

@media(max-width:600px){

    .detail-container{
        margin:15px auto;
        padding:12px;
    }

    .detail-card{
        padding:20px;
    }

    .app-header{
        align-items:flex-start;
    }

    .app-icon{
        width:80px;
        height:80px;
    }

    .app-name{
        font-size:22px;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>


<nav class="navbar-custom">

    <div class="container py-3">

        <div class="d-flex justify-content-between align-items-center">

            <a href="index.html" class="back-btn">
                <i class="bi bi-arrow-left"></i>
                Kembali
            </a>

            <div class="logo">
                <i class="bi bi-box-seam-fill"></i>
                DA•<span>OFFICIAL</span>
            </div>

        </div>

    </div>

</nav>


<div class="detail-container">

    <div id="content">

        <div class="loading">

            <div class="spinner-border"></div>

            <p class="mt-3">
                Memuat informasi APK...
            </p>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>


<script>

async function loadDetail(){

    const content =
        document.getElementById("content");


    const params =
        new URLSearchParams(
            window.location.search
        );


    const id =
        params.get("id");


    if(!id){

        showError(
            "APK tidak ditemukan."
        );

        return;

    }


    const { data, error } =
        await supabaseClient
        .from("apps")
        .select("*")
        .eq("id",id)
        .single();


    if(error || !data){

        showError(
            "Data APK tidak ditemukan."
        );

        return;

    }


    document.title =
        data.name + " - APKZone";


    content.innerHTML = `

        <div class="detail-card">

            <div class="app-header">

                <img
                    src="${escapeAttribute(
                        data.icon ||
                        "https://cdn-icons-png.flaticon.com/512/888/888859.png"
                    )}"
                    class="app-icon"
                >

                <div>

                    <div class="app-name">

                        ${escapeHTML(
                            data.name ||
                            "Tanpa nama"
                        )}

                    </div>

                    <div class="category">

                        ${escapeHTML(
                            data.category ||
                            "Lainnya"
                        )}

                    </div>

                </div>

            </div>


            <div class="info-grid">

                <div class="info-box">

                    <i class="bi bi-phone"></i>

                    <div class="info-label">
                        Versi
                    </div>

                    <div class="info-value">
                        ${escapeHTML(
                            data.version || "-"
                        )}
                    </div>

                </div>


                <div class="info-box">

                    <i class="bi bi-hdd"></i>

                    <div class="info-label">
                        Ukuran
                    </div>

                    <div class="info-value">
                        ${escapeHTML(
                            data.size || "-"
                        )}
                    </div>

                </div>


                <div class="info-box">

                    <i class="bi bi-grid"></i>

                    <div class="info-label">
                        Kategori
                    </div>

                    <div class="info-value">
                        ${escapeHTML(
                            data.category ||
                            "Lainnya"
                        )}
                    </div>

                </div>

            </div>


            <div class="description">

                <h5>
                    Tentang aplikasi
                </h5>

                <p>
                    ${escapeHTML(
                        data.description ||
                        "Tidak ada deskripsi aplikasi."
                    )}
                </p>

            </div>


            ${
                data.download_url
                ?
                `
                <a
                    href="${escapeAttribute(
                        data.download_url
                    )}"
                    target="_blank"
                    rel="noopener"
                    class="download-btn"
                >

                    <i class="bi bi-download"></i>
                    Download APK

                </a>
                `
                :
                `
                <button
                    class="download-btn"
                    disabled
                >
                    Link download belum tersedia
                </button>
                `
            }

        </div>

    `;

}


function showError(message){

    document.getElementById("content").innerHTML = `

        <div class="error">

            <i class="bi bi-exclamation-circle"></i>

            <h4 class="mt-3">
                ${escapeHTML(message)}
            </h4>

            <a
                href="index.html"
                class="btn btn-primary mt-3"
            >
                Kembali ke APKZone
            </a>

        </div>

    `;

}


function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(text){

    return escapeHTML(text);

}


loadDetail();

</script>

</body>
</html>
