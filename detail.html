<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17243a">
<title>Detail APK - APK DA•OFFICIAL</title>
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--yellow:#ffe34d;--red:#ff514b;--blue:#52d9ff;--black:#171717;--white:#fffdf4;}
body{margin:0;min-height:100vh;color:var(--black);font-family:Arial,sans-serif;background-color:var(--yellow);background-image:radial-gradient(#171717 1.3px,transparent 1.3px);background-size:17px 17px;}
.navbar-custom{background:var(--white);border-bottom:4px solid var(--black);box-shadow:0 6px 0 var(--black);}
.logo{font-size:18px;font-weight:1000;}
.logo span{color:var(--red)}
.back-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;background:var(--blue);color:var(--black);text-decoration:none;font-weight:900;border:3px solid var(--black);border-radius:10px;box-shadow:3px 3px 0 var(--black);}
.detail-container{width:min(760px,100%);margin:35px auto;padding:15px;}
.comic-title{display:table;margin:0 auto 25px;padding:12px 22px;background:var(--red);color:white;border:4px solid var(--black);border-radius:12px;box-shadow:7px 7px 0 var(--black);font-size:clamp(24px,5vw,35px);font-weight:1000;}
.detail-card{background:var(--white);border:4px solid var(--black);border-radius:22px;padding:27px;box-shadow:10px 10px 0 var(--black);}
.comic-banner{margin:-27px -27px 28px;padding:24px 12px;text-align:center;background:var(--blue);border-bottom:4px solid var(--black);}
.app-header{display:flex;align-items:center;gap:20px;}
.app-icon-wrap{width:108px;height:108px;padding:5px;flex-shrink:0;background:var(--yellow);border:4px solid var(--black);border-radius:20px;box-shadow:5px 5px 0 var(--black);}
.app-icon{width:100%;height:100%;object-fit:cover;background:white;border:2px solid var(--black);border-radius:12px;}
.app-name{font-size:clamp(22px,5vw,34px);font-weight:1000;}
.category{display:inline-block;margin-top:12px;padding:6px 12px;color:white;background:var(--red);border:3px solid var(--black);border-radius:8px;font-size:12px;font-weight:900;}
.info-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px;}
.info-box{padding:16px 6px;text-align:center;background:white;border:3px solid var(--black);border-radius:13px;box-shadow:4px 4px 0 var(--black);}
.description{margin-top:25px;padding:18px;background:white;border:3px solid var(--black);border-radius:13px;box-shadow:4px 4px 0 var(--black);}
.download-btn{display:block;width:100%;margin-top:27px;padding:17px 12px;color:white;text-align:center;text-decoration:none;font-size:16px;font-weight:1000;background:var(--red);border:4px solid var(--black);border-radius:13px;box-shadow:7px 7px 0 var(--black);cursor:pointer;}
</style>
</head>
<body>
<nav class="navbar-custom">
    <div class="container py-3">
        <a href="index.html" class="back-btn"><i class="bi bi-arrow-left"></i> Kembali</a>
    </div>
</nav>

<main class="detail-container">
    <h1 class="comic-title"><i class="bi bi-lightning-charge-fill"></i> DETAIL APK</h1>
    <div id="content">
        <div class="text-center py-5">Memuat APK...</div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase.js"></script>
<script>
async function loadDetail(){
    const content = document.getElementById("content");
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    if(!id) { content.innerHTML = "APK tidak ditemukan"; return; }

    const client = window.supabaseClient;
    const {data, error} = await client.from("apps").select("*").eq("id", id).single();
    if(error || !data) { content.innerHTML = "Data APK tidak ditemukan"; return; }

    content.innerHTML = `
        <article class="detail-card">
            <div class="comic-banner"><h5>INFORMASI APLIKASI</h5></div>
            <div class="app-header">
                <div class="app-icon-wrap"><img src="${data.icon || 'https://placehold.co/100'}" class="app-icon" alt=""></div>
                <div>
                    <div class="app-name">${data.name}</div>
                    <span class="category">${data.category || 'Lainnya'}</span>
                </div>
            </div>
            <div class="info-grid">
                <div class="info-box"><strong>Versi</strong><div>${data.version || '-'}</div></div>
                <div class="info-box"><strong>Ukuran</strong><div>${data.size || '-'}</div></div>
                <div class="info-box"><strong>Kategori</strong><div>${data.category || 'Lainnya'}</div></div>
            </div>
            <section class="description">
                <h5>Tentang Aplikasi</h5>
                <p>${data.description || 'Tidak ada deskripsi.'}</p>
            </section>
            <a href="${data.download_url}" target="_blank" class="download-btn">
                <i class="bi bi-cloud-arrow-down-fill"></i> DOWNLOAD APK SEKARANG
            </a>
        </article>
    `;
}
loadDetail();
</script>
</body>
</html>
