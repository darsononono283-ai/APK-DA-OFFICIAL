<style>
*{box-sizing:border-box}

:root{
    --yellow:#ffe34d;
    --red:#ff514b;
    --blue:#52d9ff;
    --black:#171717;
    --white:#fffdf4;
}

body{
    margin:0;
    min-height:100vh;
    color:var(--black);
    font-family:"Trebuchet MS",Arial,sans-serif;
    background-color:var(--yellow);
    background-image:radial-gradient(#171717 1.3px,transparent 1.3px);

}

.navbar-custom{

.back-btn{

.detail-container{

}

.comic-title{
    display:table;

.detail-card{

.app-icon-wrap{

.app-icon{

.app-name{

.category{

.info-grid{

.info-box{

<script>
function escapeHTML(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function safeURL(value){
    try{
        const url = new URL(String(value),window.location.href);
        if(url.protocol==="https:" || url.protocol==="http:"){
            return url.href;
        }
    }catch(error){}
    return "";
}

function showError(message){
    document.getElementById("content").innerHTML=`
        <div class="error">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <h4 class="mt-3">${escapeHTML(message)}</h4>
            <a href="index.html" class="btn mt-3 px-4 py-2">
                <i class="bi bi-arrow-left"></i>
                KEMBALI KE BERANDA
            </a>
        </div>
    `;
}


async function initAppRating(appId){
    const client = window.supabaseClient;
    const summary = document.getElementById("ratingSummary");
    const message = document.getElementById("ratingMessage");
    const buttons = [...document.querySelectorAll("#ratingButtons button[data-rating]")];

    if(!client || appId === undefined || appId === null || String(appId).trim() === ""){
        summary.textContent = "Rating belum tersedia.";
        message.textContent = "Koneksi Supabase atau ID aplikasi tidak tersedia.";
        buttons.forEach(button => button.disabled = true);
        return;
    }

    const storageKey = "da_official_rated_" + String(appId);
    let alreadyRated = false;
    try { alreadyRated = localStorage.getItem(storageKey) === "1"; } catch (_) {}

    async function refreshSummary(){
        summary.textContent = "Menghubungkan ke Supabase...";
        message.textContent = "";
        try {
            // Hindari indikator memuat selamanya jika koneksi tidak merespons.
            const request = client
                .from("app_ratings")
                .select("rating")
                .eq("app_id", String(appId));
            const timeout = new Promise((_, reject) =>
                setTimeout(() => reject(new Error("Koneksi ke Supabase terlalu lama. Periksa internet, URL, dan anon key di supabase.js.")), 12000)
            );
            const { data, error } = await Promise.race([request, timeout]);

            if(error) throw error;

            const ratings = (data || []).map(row => Number(row.rating)).filter(n => Number.isFinite(n) && n >= 1 && n <= 5);
            if(!ratings.length){
                summary.textContent = "Belum ada rating. Jadilah yang pertama!";
            } else {
                const average = ratings.reduce((sum, n) => sum + n, 0) / ratings.length;
                summary.textContent = "⭐ " + average.toFixed(1) + " / 5 · " + ratings.length + " penilaian";
            }
            return true;
        } catch(error) {
            console.error("Gagal membaca rating Supabase:", error);
            summary.textContent = "Rating belum dapat dimuat.";
            message.textContent = "Detail: " + (error?.message || String(error));
            return false;
        }
    }

    const loaded = await refreshSummary();
    if(!loaded){
        // Rating gagal dimuat, tetapi jangan biarkan tombol tampak seperti macet.
        buttons.forEach(button => button.disabled = false);
    }

    if(alreadyRated){
        message.textContent = "Kamu sudah memberi rating untuk aplikasi ini di perangkat ini.";
        buttons.forEach(button => button.disabled = true);
        return;
    }

    buttons.forEach(button => {
        button.addEventListener("click", async () => {
            const rating = Number(button.dataset.rating);
            if(!Number.isInteger(rating) || rating < 1 || rating > 5) return;

            buttons.forEach(item => item.disabled = true);
            message.textContent = "Menyimpan rating...";

            // Jangan kirim kolom id; database yang membuatnya otomatis.
            // Ambil voter_id stabil untuk browser ini agar sesuai dengan kebijakan RLS.
            // Mendukung kolom voter_id bertipe text atau uuid.
            let voterId = "";
            const voterStorageKey = "da_official_voter_id";
            try {
                voterId = localStorage.getItem(voterStorageKey) || "";
                if (!voterId) {
                    if (window.crypto && typeof window.crypto.randomUUID === "function") {
                        voterId = window.crypto.randomUUID();
                    } else {
                        voterId = "voter-" + Date.now().toString(36) + "-" +
                            Math.random().toString(36).slice(2, 12);
                    }
                    localStorage.setItem(voterStorageKey, voterId);
                }
            } catch (_) {
                voterId = (window.crypto && typeof window.crypto.randomUUID === "function")
                    ? window.crypto.randomUUID()
                    : "voter-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
            }

            const { error } = await client
                .from("app_ratings")
                .insert({
                    app_id: String(appId),
                    rating: rating,
                    voter_id: voterId
                });

            if(error){
                console.error("Gagal menyimpan rating Supabase:", error);
                message.textContent = "Gagal menyimpan rating: " + (error.message || "Periksa tabel dan izin INSERT.");
                buttons.forEach(item => item.disabled = false);
                return;
            }

            try { localStorage.setItem(storageKey, "1"); } catch (_) {}
            message.textContent = "Terima kasih! Rating berhasil disimpan.";
            await refreshSummary();
            buttons.forEach(item => item.disabled = true);
        });
    });
}


function formatReviewDate(value){
    if(!value) return "";
    const date = new Date(value);
    if(Number.isNaN(date.getTime())) return "";
    return date.toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});
}

async function initDownloadStats(appId){
    const client = window.supabaseClient;
    const countEl = document.getElementById("downloadCount");
    if(!countEl) return;
    if(!client){ countEl.textContent = "Belum tersedia"; return; }
    try{
        const { count, error } = await client
            .from("app_downloads")
            .select("id",{count:"exact",head:true})
            .eq("app_id",String(appId));
        if(error) throw error;
        countEl.textContent = Number(count || 0).toLocaleString("id-ID") + " unduhan";
    }catch(error){
        console.error("Gagal memuat statistik unduhan:",error);
        countEl.textContent = "Belum tersedia";
    }
}

function initDownloadTracking(appId){
    const button = document.getElementById("downloadAppButton");
    const client = window.supabaseClient;
    if(!button || !client) return;
    button.addEventListener("click", async function(event){
        // Buka tab secara langsung agar tidak diblokir, lalu catat klik sebelum mengarah ke file.
        event.preventDefault();
        const url = button.href;
        const downloadTab = window.open("about:blank","_blank");
        if(downloadTab) downloadTab.opener = null;
        try{
            const record = client.from("app_downloads").insert({app_id:String(appId)});
            await Promise.race([
                record,
                new Promise(resolve => setTimeout(resolve,1200))
            ]);
        }catch(error){
            console.error("Gagal mencatat klik unduhan:",error);
        }finally{
            if(downloadTab){
                try{ downloadTab.location.href = url; }
                catch(_){ window.location.href = url; }
            }else{
                window.location.href = url;
            }
        }
    });
}

async function initUserReviews(appId){
    const client = window.supabaseClient;
    const form = document.getElementById("reviewForm");
    const list = document.getElementById("reviewsList");
    const message = document.getElementById("reviewsMessage");
    const submit = document.getElementById("reviewSubmit");
    if(!form || !list || !message || !submit) return;

    function renderReviews(rows){
        if(!rows || !rows.length){
            list.innerHTML = '<div class="reviews-empty">Belum ada ulasan. Jadilah yang pertama berbagi pengalaman!</div>';
            return;
        }
        list.innerHTML = rows.map(row => `
            <article class="review-item">
                <div class="review-item-head">
                    <span class="review-author"><i class="bi bi-person-circle" aria-hidden="true"></i> ${escapeHTML(row.display_name || "Pengguna")}</span>
                    <time class="review-date">${escapeHTML(formatReviewDate(row.created_at))}</time>
                </div>
                <p class="review-text">${escapeHTML(row.review_text || "")}</p>
            </article>
        `).join("");
    }

    async function loadReviews(){
        if(!client){
            list.innerHTML = '<div class="reviews-empty">Koneksi Supabase belum tersedia.</div>';
            return;
        }
        try{
            const {data,error} = await client.from("app_reviews")
                .select("display_name,review_text,created_at")
                .eq("app_id",String(appId))
                .order("created_at",{ascending:false})
                .limit(20);
            if(error) throw error;
            renderReviews(data || []);
        }catch(error){
            console.error("Gagal memuat ulasan:",error);
            list.innerHTML = '<div class="reviews-empty">Ulasan belum dapat dimuat. Periksa tabel dan kebijakan Supabase.</div>';
        }
    }

    form.addEventListener("submit",async function(event){
        event.preventDefault();
        const reviewText = document.getElementById("reviewText").value.trim();
        const displayName = document.getElementById("reviewName").value.trim().slice(0,40) || "Pengguna";
        if(!reviewText){
            message.textContent = "Tulis ulasan terlebih dahulu.";
            return;
        }
        if(reviewText.length > 800){
            message.textContent = "Ulasan maksimal 800 karakter.";
            return;
        }
        if(!client){
            message.textContent = "Koneksi Supabase belum tersedia.";
            return;
        }
        submit.disabled = true;
        message.textContent = "Mengirim ulasan...";
        try{
            const {error} = await client.from("app_reviews").insert({
                app_id:String(appId),
                display_name:displayName,
                review_text:reviewText
            });
            if(error) throw error;
            form.reset();
            message.textContent = "Terima kasih! Ulasan berhasil dikirim.";
            await loadReviews();
        }catch(error){
            console.error("Gagal mengirim ulasan:",error);
            message.textContent = "Ulasan gagal dikirim. Periksa tabel app_reviews dan kebijakan RLS di Supabase.";
        }finally{
            submit.disabled = false;
        }
    });
    await loadReviews();
}
