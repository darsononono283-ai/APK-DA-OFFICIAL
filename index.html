#loading {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background:
        radial-gradient(ellipse at center, #17163b 0%, #080b16 65%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    overflow: hidden;
    transition: opacity .7s ease, visibility .7s ease;
}

#loading.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

#loading::before,
#loading::after {
    content: "";
    position: absolute;
    width: 260px;
    height: 260px;
    border: 1px solid rgba(129,117,255,.18);
    border-radius: 50%;
    animation: orbit 8s linear infinite;
}

#loading::after {
    width: 340px;
    height: 340px;
    border-color: rgba(0,210,255,.12);
    animation-direction: reverse;
}

.loader-logo {
    position: relative;
    z-index: 2;
    width: 90px;

    border-radius: 27px;

.loader-ring {

@keyframes spin {

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase.js"></script>

    <script>
        let apps = [];
        let selectedCategory = "Semua";

        async function loadApps() {
            const appGrid = document.getElementById("appGrid");

            try {
                if (typeof supabaseClient === "undefined") {
                    throw new Error("Konfigurasi Supabase belum berhasil dimuat.");
                }

                const { data, error } = await supabaseClient
                    .from("apps")
                    .select("*")
                    .order("created_at", { ascending: false });

                if (error) throw error;

                apps = data || [];
                renderApps();
            } catch (error) {
                appGrid.innerHTML = `
                    <div class="empty" style="grid-column:1/-1">
                        <i class="bi bi-exclamation-circle"></i>
                        <h5 class="mt-3">Gagal memuat aplikasi</h5>
                        <p>${escapeHTML(error.message || "Terjadi kesalahan.")}</p>
                    </div>`;
            }
        }

        function renderApps() {
            const grid = document.getElementById("appGrid");
            const search = document.getElementById("searchInput").value.toLowerCase().trim();

            const filtered = apps.filter(app => {
                const matchSearch = (app.name || "").toLowerCase().includes(search);
                const matchCategory = selectedCategory === "Semua" || app.category === selectedCategory;
                return matchSearch && matchCategory;
            });

            if (!filtered.length) {
                grid.innerHTML = `
                    <div class="empty" style="grid-column:1/-1">
                        <i class="bi bi-box-seam"></i>
                        <h5 class="mt-3">APK tidak ditemukan</h5>
                        <p>Coba gunakan kata pencarian lain.</p>
                    </div>`;
                return;
            }

            grid.innerHTML = filtered.map(app => `
                <div class="app-card">
                    <img
                        src="${escapeAttribute(app.icon || "https://cdn-icons-png.flaticon.com/512/888/888859.png")}"
                        class="app-icon"
                        alt="Ikon ${escapeAttribute(app.name || "APK")}"
                        loading="lazy"
                    >
                    <div class="app-name">${escapeHTML(app.name || "Tanpa nama")}</div>
                    <div class="app-description">${escapeHTML(app.description || "Tidak ada deskripsi.")}</div>
                    <div class="app-meta">
                        <i class="bi bi-phone"></i> ${escapeHTML(app.version || "-")}
                        &nbsp; • &nbsp; ${escapeHTML(app.size || "-")}
                    </div>
                    <a href="detail.html?id=${encodeURIComponent(app.id)}" class="download-btn">
                        <i class="bi bi-info-circle"></i> Lihat Detail
                    </a>
                </div>
            `).join("");
        }

        document.getElementById("searchInput").addEventListener("input", renderApps);

        document.querySelectorAll(".category-btn").forEach(button => {
            button.addEventListener("click", function () {
                document.querySelectorAll(".category-btn").forEach(btn => btn.classList.remove("active"));
                this.classList.add("active");
                selectedCategory = this.dataset.category;
                renderApps();
            });
        });

        function escapeHTML(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function escapeAttribute(value) {
            return escapeHTML(value);
        }

        loadApps();

function hideLoading() {
    const loading = document.getElementById("loading");
    if (!loading) return;

    loading.classList.add("hide");

    setTimeout(() => loading.remove(), 750);
}

window.addEventListener("load", () => {
    setTimeout(hideLoading, 900);
});

// Pengaman agar layar loading tidak tertinggal.
setTimeout(hideLoading, 5000);

      
/* ===== SISTEM NOTIFIKASI APK ===== */
(() => {
    const btn = document.getElementById("notificationBtn");
    const panel = document.getElementById("notificationPanel");
    const list = document.getElementById("notificationList");
    const count = document.getElementById("notificationCount");
    const markRead = document.getElementById("markReadBtn");

    if (!btn || !panel || !list || !count || !markRead) return;

    let notifications = [];
    const storageKey = "apkda_notifications_read";

    function getReadIds() {
        try {
            return JSON.parse(localStorage.getItem(storageKey) || "[]");
        } catch {
            return [];
        }
    }

    function renderNotifications() {
        const readIds = getReadIds();
        const unread = notifications.filter(n => !readIds.includes(n.id));

        count.textContent = unread.length > 99 ? "99+" : unread.length;
        count.style.display = unread.length ? "flex" : "none";

        if (!notifications.length) {
            list.innerHTML = `
                <div class="notification-empty">
                    Belum ada notifikasi APK baru.
                </div>`;
            return;
        }

        list.innerHTML = notifications.map(n => `
            <div class="notification-item ${readIds.includes(n.id) ? "" : "unread"}">
                <strong>📦 APK baru tersedia</strong>
                <div>${escapeHTML(n.name || "Aplikasi baru")}</div>
                <small>${escapeHTML(n.time || "")}</small>
            </div>
        `).join("");
    }

    async function loadNotifications() {
        if (typeof supabaseClient === "undefined") return;

        const { data, error } = await supabaseClient
            .from("apps")
            .select("id, name, created_at")
            .order("created_at", { ascending: false })
            .limit(20);

        if (error) {
            console.error("Gagal memuat notifikasi:", error.message);
            return;
        }

        notifications = (data || []).map(app => ({
            id: String(app.id),
            name: app.name,
            time: app.created_at
                ? new Date(app.created_at).toLocaleString("id-ID")
                : ""
        }));

        renderNotifications();
    }

    btn.addEventListener("click", () => {
        const opened = panel.classList.toggle("show");
        btn.setAttribute("aria-expanded", String(opened));
    });

    markRead.addEventListener("click", () => {
        try {
            localStorage.setItem(
                storageKey,
                JSON.stringify(notifications.map(n => n.id))
            );
            renderNotifications();
        } catch (error) {
            console.error("Gagal menyimpan status notifikasi:", error);
        }
    });

    document.addEventListener("click", event => {
        if (!event.target.closest(".notification-wrap")) {
            panel.classList.remove("show");
            btn.setAttribute("aria-expanded", "false");
        }
    });

    loadNotifications();
})();
