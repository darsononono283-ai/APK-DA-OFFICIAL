
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>APK DA•OFFICIAL V3</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">APK DA<span>•</span>OFFICIAL</div>
    <button class="menu-btn" aria-label="Menu">☰</button>
  </header>

  <main class="container">

    <section class="hero">
      <span class="tag">ANDROID APPLICATION STORE</span>
      <h1>Temukan Aplikasi <span>Favoritmu.</span></h1>
      <p>
        Jelajahi berbagai aplikasi dan game Android
        dalam satu tempat.
      </p>
    </section>

    <section class="search-box">
      <span>⌕</span>
      <input
        type="search"
        id="searchInput"
        placeholder="Cari aplikasi atau game..."
      >
    </section>

    <section class="category-section">
      <h2>Kategori</h2>

      <div class="categories" id="categories">
        <button class="category active" data-category="Semua">Semua</button>
        <button class="category" data-category="Game">Game</button>
        <button class="category" data-category="Sosial">Sosial</button>
        <button class="category" data-category="Media">Media</button>
        <button class="category" data-category="Tools">Tools</button>
      </div>
    </section>

    <section class="apps-section">
      <div class="section-heading">
        <h2>Aplikasi Populer</h2>
        <span id="appCount">0 aplikasi</span>
      </div>

      <div class="app-grid" id="appList"></div>
    </section>

  </main>

  <footer>
    <p>© 2026 APK DA•OFFICIAL V3</p>
    <small>Platform berbagi aplikasi Android.</small>
  </footer>

  <script src="script.js"></script>
</body>
</html>
