/* LOADING */

#loading{

    inset:0;
    z-index:9999;

    align-items:center;
    justify-content:center;

.loader-logo{

    background:linear-gradient(135deg,#635bff,#8b5cf6);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:bold;
    animation:pulse 1.5s infinite;
}

.loader-text{
    margin-top:20px;
    color:#aaa;
}

.loader-bar{
    width:180px;
    height:4px;
    background:#252a40;
    border-radius:10px;
    overflow:hidden;
    margin-top:15px;
}

.loader-progress{
    width:0%;
    height:100%;
    background:#8175ff;
    animation:loading 1.5s forwards;
}

@keyframes loading{
    from{width:0}
    to{width:100%}
}

@keyframes pulse{
    50%{
        transform:scale(1.08);
        box-shadow:0 0 35px rgba(99,91,255,.5);
    }
}

/* NAVBAR */

}

}

/* HERO */

.hero h1{

}

.hero p{

}

.search-box{
    max-width:650px;

}

/* CATEGORY */

.category-btn.active{

    border-color:#635bff;

    /* STATUS ONLINE */
.online-status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 12px;
    border-radius: 20px;
    background: rgba(34, 197, 94, 0.12);
    color: #22c55e;

.online-dot {

}

@keyframes onlinePulse {
    0%, 100% {
        opacity: 1;
        transform: scale(1);
    }

    50% {

        transform: scale(0.8);
    }
}

/* CONTENT */

.container-apps{
    max-width:1100px;
    margin:auto;
    padding:10px 20px 60px;
}

.app-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));

.app-card{

.app-card:hover{

.app-icon{

.download-btn{

    background:linear-gradient(90deg,#635bff,#8b5cf6);
    color:white;
    font-weight:bold;

}

.download-btn:hover{

}

/* EMPTY */

.empty{

    color:#777f96;
}

.empty i{

</style>

</head>

<body>

</div>

</nav>


<!-- HERO -->

<section class="hero">

    <div class="search-box">

        <input
            type="text"

            placeholder="Cari aplikasi..."

<!-- CATEGORY -->

<div class="categories">

        data-category="Lainnya"
    >

</div>


<!-- APK -->

<div class="container-apps">

    <div id="appGrid" class="app-grid">

        <div class="empty">

            <div class="spinner-border"></div>

            <p class="mt-3">
                Memuat aplikasi...
            </p>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>


<script>

let apps = [];
let selectedCategory = "Semua";


/* LOAD */

async function loadApps(){

    const appGrid =
        document.getElementById("appGrid");


    const { data, error } =
        await supabaseClient
        .from("apps")
        .select("*")
        .order("created_at",{
            ascending:false
        });


    if(error){

        appGrid.innerHTML = `
            <div class="empty">

                <i class="bi bi-exclamation-circle"></i>

                <h5 class="mt-3">
                    Gagal memuat aplikasi
                </h5>

                <p>
                    ${escapeHTML(error.message)}
                </p>

            </div>
        `;

        return;
    }


    apps = data || [];

    renderApps();

}


/* RENDER */

function renderApps(){

    const grid =
        document.getElementById("appGrid");

    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    const filtered =
        apps.filter(app => {

            const matchSearch =
                (app.name || "")
                .toLowerCase()
                .includes(search);


            const matchCategory =
                selectedCategory === "Semua" ||
                app.category === selectedCategory;


            return matchSearch && matchCategory;

        });


    if(!filtered.length){

        grid.innerHTML = `
            <div class="empty" style="grid-column:1/-1">

                <i class="bi bi-box-seam"></i>

                <h5 class="mt-3">
                    APK tidak ditemukan
                </h5>

                <p>
                    Coba gunakan kata pencarian lain.
                </p>

            </div>
        `;

        return;
    }


    grid.innerHTML =
        filtered.map(app => `

            <div class="app-card">

                <img
                    src="${escapeAttribute(
                        app.icon ||
                        "https://cdn-icons-png.flaticon.com/512/888/888859.png"
                    )}"
                    class="app-icon"
                >

                <div class="app-name">
                    ${escapeHTML(app.name || "Tanpa nama")}
                </div>

                <div class="app-description">
                    ${escapeHTML(
                        app.description ||
                        "Tidak ada deskripsi."
                    )}
                </div>

                <div class="app-meta">

                    <i class="bi bi-phone"></i>
                    ${escapeHTML(app.version || "-")}

                    &nbsp; • &nbsp;

                    ${escapeHTML(app.size || "-")}

                </div>

                <a
    href="detail.html?id=${app.id}"
    class="download-btn"
>
    <i class="bi bi-info-circle"></i>
    Lihat Detail
</a>

            

            </div>

        `).join("");

}


/* SEARCH */

document
.getElementById("searchInput")
.addEventListener(
    "input",
    renderApps
);


/* CATEGORY */

document
.querySelectorAll(".category-btn")
.forEach(button => {

    button.addEventListener(
        "click",
        function(){

            document
            .querySelectorAll(".category-btn")
            .forEach(btn =>
                btn.classList.remove("active")
            );

            this.classList.add("active");

            selectedCategory =
                this.dataset.category;

            renderApps();

        }
    );

});


/* ESCAPE */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function escapeAttribute(text){

    return escapeHTML(text);

}


/* MULAI */

loadApps();


/* HILANGKAN LOADING */

window.addEventListener("load",function(){

    setTimeout(function(){

        document
        .getElementById("loading")
        .style.display = "none";

    },1200);

});

</script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
