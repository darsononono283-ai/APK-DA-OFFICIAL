<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b13"><title>APK DA•OFFICIAL V3</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#39256c55,transparent 35%),#090b13;color:#f5f6fc;font-family:"DM Sans",sans-serif}.wrap{width:min(1100px,calc(100% - 30px));margin:auto}header{padding:17px 0;border-bottom:1px solid #ffffff16;background:#090b13dd;position:sticky;top:0}.bar{display:flex;justify-content:space-between;align-items:center}.brand{font:700 18px "Space Grotesk"}.brand b{color:#b49aff}.admin{color:#c4b5ff;text-decoration:none;font-size:12px;border:1px solid #a78bfa55;padding:9px 13px;border-radius:10px}.hero{margin:28px 0;padding:40px;border:1px solid #b39aff33;border-radius:25px;background:linear-gradient(115deg,#2b2050,#17283a)}.eyebrow{font-size:10px;letter-spacing:2px;color:#c6b5ff;font-weight:bold}.hero h1{font:700 clamp(32px,5vw,50px)/1.1 "Space Grotesk";max-width:600px;margin:15px 0}.hero h1 span{color:#8de5f0}.hero p{color:#c4c9d8;max-width:520px;line-height:1.7}.search{display:flex;margin:25px 0}.search input{flex:1;min-width:0;padding:14px;background:#151a29;color:white;border:1px solid #ffffff20;border-radius:12px}.heading{margin:25px 0 13px;font:700 22px "Space Grotesk"}.chips{display:flex;gap:8px;overflow:auto}.chip{background:#151a29;border:1px solid #ffffff20;color:#c3c8d6;padding:10px 14px;border-radius:11px;white-space:nowrap}.chip.active{background:#704db9;color:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:15px 0 45px}.app{background:#151a29;border:1px solid #ffffff16;border-radius:17px;padding:14px;min-width:0}.app img{width:55px;height:55px;object-fit:cover;border-radius:15px;background:#34265d}.app h3{font:700 14px "Space Grotesk"}.app p,.meta{font-size:11px;color:#9ba3b6;line-height:1.5}.app a{display:block;text-align:center;padding:9px;border-radius:9px;background:#8b5cf622;color:#d5c7ff;text-decoration:none;font-size:11px;margin-top:10px}.empty{grid-column:1/-1;text-align:center;color:#aab1c2;padding:30px;border:1px dashed #ffffff22;border-radius:14px}footer{border-top:1px solid #ffffff16;padding:25px 0;color:#9ba3b6;font-size:11px}@media(max-width:800px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.hero{padding:26px 20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.app{padding:10px}}
</style></head><body><header><div class="wrap bar"><div class="brand">APK DA<b>•</b>OFFICIAL V3</div><a class="admin" href="admin.html">Admin ↗</a></div></header><main class="wrap"><section class="hero"><div class="eyebrow">ANDROID APP COLLECTION</div><h1>Temukan aplikasi <span>favoritmu.</span></h1><p>Jelajahi aplikasi dan game Android. Baca informasi sebelum mengunduh.</p></section><input class="search" id="q" type="search" placeholder="Cari aplikasi atau game..." style="width:100%"><div class="heading">Kategori</div><div class="chips" id="cats"><button class="chip active" data-c="Semua">Semua</button><button class="chip" data-c="Game">Game</button><button class="chip" data-c="Sosial">Sosial</button><button class="chip" data-c="Media">Media</button><button class="chip" data-c="Tools">Tools</button><button class="chip" data-c="Lainnya">Lainnya</button></div><div class="heading">Semua aplikasi <small id="count" class="meta"></small></div><section class="grid" id="apps"><div class="empty">Memuat katalog...</div></section></main><footer><div class="wrap">© <span id="year"></span> APK DA•OFFICIAL. Unduh hanya APK yang boleh didistribusikan.</div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>
const db=window.db;
let rows=[],cat="Semua";const $=id=>document.getElementById(id);$("year").textContent=new Date().getFullYear();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){let q=$("q").value.toLowerCase();let a=rows.filter(x=>(cat==="Semua"||x.category===cat)&&(`${x.name} ${x.description}`).toLowerCase().includes(q));$("count").textContent=`${a.length} aplikasi`; $("apps").innerHTML=a.length?a.map(x=>`<article class="app"><img src="${esc(x.icon_url)}" alt="" onerror="this.style.visibility='hidden'"><h3>${esc(x.name)}</h3><p>${esc(x.description)}</p><div class="meta">${esc(x.category)} · ${esc(x.version||"-")} · ${esc(x.size||"-")}</div><a href="detail.html?id=${encodeURIComponent(x.id)}">Lihat detail →</a></article>`).join(""):'<div class="empty">Aplikasi tidak ditemukan.</div>'}
async function start(){try{if(!db)throw Error(window.supabaseConfigError||"Koneksi Supabase belum siap. Pastikan supabase.js berada satu folder dengan index.html.");let {data,error}=await db.from("apps").select("*").eq("is_published",true).order("created_at",{ascending:false});if(error)throw error;rows=data||[];render()}catch(e){$("apps").innerHTML=`<div class="empty">${esc(e.message)}</div>`}}$("q").addEventListener("input",render);$("cats").onclick=e=>{let b=e.target.closest("[data-c]");if(!b)return;cat=b.dataset.c;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x===b));render()};start();
</script></body></html>
